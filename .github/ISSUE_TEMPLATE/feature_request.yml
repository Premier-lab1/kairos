name: Feature request
description: Suggest an improvement or a new signal feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? For scoring ideas, say which data is known at the time of the signal.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Examples, token mints, backtest numbers or links that motivate the change.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand Kairos reports data and statistics and does not give financial advice.
          required: true
